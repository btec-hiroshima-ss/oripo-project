volumes:
  oripo-db-data:

services:
  app:
    image: ghcr.io/btec-hiroshima-ss/oripo-project:latest
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/var/log/app
    env_file:
      - .env.production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Tokyo
    ports:
      # DBeaver（サーバー直インストール）から接続するため localhost にのみ露出
      - "127.0.0.1:5432:5432"
    volumes:
      - oripo-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backup:
    image: postgres:16-alpine
    volumes:
      - ./backups:/backups
    env_file:
      - .env.production
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      TZ: Asia/Tokyo
    entrypoint: >
      sh -c '
        echo "0 3 * * * pg_dump -h db -U $${DB_USER} $${DB_NAME} --format=custom -f /backups/$$(date +\%Y\%m\%d_\%H\%M\%S).dump && find /backups -name \"*.dump\" -mtime +30 -delete && echo \"Backup completed: $$(date)\"" | crontab -
        crond -f
      '
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
