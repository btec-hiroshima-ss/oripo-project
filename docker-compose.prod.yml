volumes:
  oripo-db-data:

services:
  app:
    image: ghcr.io/btec-hiroshima-ss/oripo-project:latest
    ports:
      # 外部公開は tunnel コンテナ（Cloudflare）経由で行うため、サーバー内（localhost）にのみ公開する。
      # Docker が公開したポートは UFW を素通りするため、"3000:3000" のままだと LAN から直接アクセスできてしまう
      - "127.0.0.1:3000:3000"
    volumes:
      - ./logs:/var/log/app
    env_file:
      - .env.production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Tokyo
    ports:
      # DBeaver（サーバー直インストール）から接続するため localhost にのみ露出
      - "127.0.0.1:5432:5432"
    volumes:
      - oripo-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 外部公開（暫定）: Cloudflare Quick Tunnel。独自ドメインが用意できるまでのつなぎ（#190 で名前付き Tunnel に移行予定）
  # アカウント・ドメイン不要で https://<ランダム>.trycloudflare.com の URL が発行される。
  # URL はこのコンテナが起動し直すたびに変わる（サーバー再起動・docker compose down/up・このサービスの設定変更時）。
  # 現在の URL は scripts/tunnel-url.sh で確認する。手順・制約は docs/04_operation/SERVER.md 参照
  tunnel:
    # 再起動のたびに URL が変わるため、deploy.sh の pull で勝手に作り直されないようバージョンを固定する
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate --url http://app:3000
    restart: unless-stopped
    depends_on:
      - app

  backup:
    image: postgres:16-alpine
    volumes:
      - ./backups:/backups
    env_file:
      - .env.production
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      TZ: Asia/Tokyo
    entrypoint: >
      sh -c '
        echo "0 3 * * * pg_dump -h db -U $${DB_USER} $${DB_NAME} --format=custom -f /backups/$$(date +\%Y\%m\%d_\%H\%M\%S).dump && find /backups -name \"*.dump\" -mtime +30 -delete && echo \"Backup completed: $$(date)\"" | crontab -
        crond -f
      '
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
