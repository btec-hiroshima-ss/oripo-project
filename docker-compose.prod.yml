volumes:
  oripo-db-data:
  pgadmin-data:

services:
  app:
    image: ghcr.io/btec-hiroshima-ss/oripo-project:latest
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Tokyo
    volumes:
      - oripo-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # pgAdmin: DB 管理 UI（リモートデスクトップ接続時に http://localhost:5050 でアクセス）
  # 初期ログイン: admin@oripo.com / oripo
  # 接続先: host=db port=5432（.env.production の DB_USER / DB_PASSWORD / DB_NAME を使用）
  pgadmin:
    image: dpage/pgadmin4:8.14
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@oripo.com
      PGADMIN_DEFAULT_PASSWORD: oripo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    volumes:
      - ./backups:/backups
    env_file:
      - .env.production
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      TZ: Asia/Tokyo
    entrypoint: >
      sh -c '
        echo "0 3 * * * pg_dump -h db -U $${DB_USER} $${DB_NAME} | gzip > /backups/$$(date +\%Y\%m\%d_\%H\%M\%S).dump.gz && find /backups -name \"*.dump.gz\" -mtime +30 -delete && echo \"Backup completed: $$(date)\"" | crontab -
        crond -f
      '
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
