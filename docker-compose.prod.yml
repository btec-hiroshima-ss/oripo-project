volumes:
  oripo-db-data:
  portainer-data:
  cloudbeaver-workspace:

services:
  app:
    image: ghcr.io/btec-hiroshima-ss/oripo-project:latest
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Tokyo
    volumes:
      - oripo-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Portainer: コンテナ管理 UI（リモートデスクトップ接続時に http://localhost:9000 でアクセス）
  # 初期ログイン: admin / ${PORTAINER_ADMIN_PASSWORD}（.env.production で設定）
  portainer:
    image: portainer/portainer-ce:2.21.5
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
      - ./docker/portainer/admin_password.txt:/run/secrets/admin_password:ro
    command: --admin-password-file /run/secrets/admin_password
    restart: unless-stopped

  # CloudBeaver: DB 管理 UI（リモートデスクトップ接続時に http://localhost:8978 でアクセス）
  # 初期ログイン: cbadmin / oripo123（.env.production の CB_ADMIN_NAME / CB_ADMIN_PASSWORD で変更可）
  # 接続先: host=db port=5432（.env.production の DB_USER / DB_PASSWORD / DB_NAME を使用）
  cloudbeaver:
    image: dbeaver/cloudbeaver:24.3.4
    ports:
      - "127.0.0.1:8978:8978"
    volumes:
      - cloudbeaver-workspace:/opt/cloudbeaver/workspace
    environment:
      CB_ADMIN_NAME: ${CB_ADMIN_NAME}
      CB_ADMIN_PASSWORD: ${CB_ADMIN_PASSWORD}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    volumes:
      - ./backups:/backups
    env_file:
      - .env.production
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      TZ: Asia/Tokyo
    entrypoint: >
      sh -c '
        echo "0 3 * * * pg_dump -h db -U $${DB_USER} $${DB_NAME} | gzip > /backups/$$(date +\%Y\%m\%d_\%H\%M\%S).dump.gz && find /backups -name \"*.dump.gz\" -mtime +30 -delete && echo \"Backup completed: $$(date)\"" | crontab -
        crond -f
      '
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
