volumes:
  claude-code-bashhistory:
  claude-code-config:
  oripo-db-data:

services:
  claude:
    build:
      context: ./docker/claude
      args:
        TZ: Asia/Tokyo
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        GIT_DELTA_VERSION: ${GIT_DELTA_VERSION:-0.18.2}
        ZSH_IN_DOCKER_VERSION: ${ZSH_IN_DOCKER_VERSION:-1.2.0}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./:/workspace
      - claude-code-bashhistory:/commandhistory
      - claude-code-config:/home/node/.claude
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CLAUDE_CONFIG_DIR: "/home/node/.claude"
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"
      GH_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      TZ: Asia/Tokyo
    user: "node"
    tty: true
    stdin_open: true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app:
    build:
      context: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      TZ: Asia/Tokyo
      DATABASE_URL: postgres://aipo_postgres:aipo@db:5432/aipo
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aipo_postgres
      POSTGRES_PASSWORD: aipo
      POSTGRES_DB: aipo
      TZ: Asia/Tokyo
    volumes:
      - oripo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backup:
    image: postgres:16-alpine
    volumes:
      - ./backups:/backups
    environment:
      PGPASSWORD: aipo
      TZ: Asia/Tokyo
    entrypoint: >
      sh -c '
        echo "0 3 * * * pg_dump -h db -U aipo_postgres aipo | gzip > /backups/$$(date +\%Y\%m\%d_\%H\%M\%S).dump.gz && find /backups -name \"*.dump.gz\" -mtime +30 -delete && echo \"Backup completed: $$(date)\"" | crontab -
        crond -f
      '
    depends_on:
      db:
        condition: service_healthy

  chrome:
    build:
      context: ./docker/chrome
    command: ["/entrypoint.sh"]
    shm_size: "2gb"
    init: true
    tmpfs:
      - /tmp/chrome-data:size=512m
    environment:
      TZ: Asia/Tokyo
    deploy:
      resources:
        limits:
          memory: 2G
    tty: true
    stdin_open: true
