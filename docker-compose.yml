volumes:
  claude-code-bashhistory:
  claude-code-config:
  oripo-db-data:
  portainer-data:
  pgadmin-data:

services:
  claude:
    build:
      context: ./docker/claude
      args:
        TZ: Asia/Tokyo
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        GIT_DELTA_VERSION: ${GIT_DELTA_VERSION:-0.18.2}
        ZSH_IN_DOCKER_VERSION: ${ZSH_IN_DOCKER_VERSION:-1.2.0}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./:/workspace
      - claude-code-bashhistory:/commandhistory
      - claude-code-config:/home/node/.claude
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CLAUDE_CONFIG_DIR: "/home/node/.claude"
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"
      GH_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      TZ: Asia/Tokyo
    user: "node"
    tty: true
    stdin_open: true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app:
    build:
      context: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/var/log/app
    environment:
      NODE_ENV: development
      TZ: Asia/Tokyo
      DATABASE_URL: postgres://aipo_postgres:aipo@db:5432/aipo
      SESSION_SECRET: dev-secret-please-change-in-production-min-32-chars!!
      LOG_FILE: /var/log/app/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aipo_postgres
      POSTGRES_PASSWORD: aipo
      POSTGRES_DB: aipo
      TZ: Asia/Tokyo
    volumes:
      - oripo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backup:
    image: postgres:16-alpine
    volumes:
      - ./backups:/backups
      - ./logs:/var/log/app
      - ./docker/backup/entrypoint.sh:/entrypoint.sh:ro
    environment:
      PGPASSWORD: aipo
      TZ: Asia/Tokyo
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Portainer: コンテナ管理 UI（http://localhost:9000）
  # 初期ログイン: admin / oripo
  portainer:
    image: portainer/portainer-ce:2.21.5
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
      - ./docker/portainer/admin_password.txt:/run/secrets/admin_password:ro
    command: --admin-password-file /run/secrets/admin_password
    restart: unless-stopped

  # pgAdmin: DB 管理 UI（http://localhost:5050）
  # 初期ログイン: admin@oripo.local / Oripo123
  # 接続先: host=db port=5432 user=aipo_postgres password=aipo db=aipo
  pgadmin:
    image: dpage/pgadmin4:8.14
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@oripo.local
      PGADMIN_DEFAULT_PASSWORD: Oripo123
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  chrome:
    build:
      context: ./docker/chrome
    ports:
      - "6080:6080"
    command: ["/entrypoint.sh"]
    shm_size: "2gb"
    init: true
    tmpfs:
      - /tmp/chrome-data:size=512m
    environment:
      TZ: Asia/Tokyo
    deploy:
      resources:
        limits:
          memory: 2G
    tty: true
    stdin_open: true
